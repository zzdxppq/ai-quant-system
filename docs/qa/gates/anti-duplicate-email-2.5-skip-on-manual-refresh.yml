ac_coverage:
  total: 7
  fully_verified: 7
  coverage_rate: 100
  details:
    - ac_id: AC1
      verification: "src/scheduler.py:353 — `def run_screener_update(skip_email: bool | None = None) -> dict:`. Default None preserves zero-arg call sites (main.py 9:27 cron + CLI --screen + push2 recovery)."
      status: VERIFIED
    - ac_id: AC2
      verification: "src/scheduler.py:684 `if _should_send_email(skip_email):` wraps the entire 8c block (lines 685-725). When skip_email=True, _should_send_email returns False (line 346-347) → entire send_screener_report try-block skipped → log printed at line 727-730 with skip_email value and now_cn() timestamp. Test: test_skip_email_true_never_sends PASS."
      status: VERIFIED
    - ac_id: AC3
      verification: "src/scheduler.py:348-349 `if skip_email is False: return True` forces send regardless of time. Test: test_skip_email_false_always_sends PASS."
      status: VERIFIED
    - ac_id: AC4
      verification: "src/scheduler.py:325-336 `_in_927_window` reads SCREENER_CRON_HOUR/SCREENER_CRON_MINUTE constants (no hardcoded 9:27); `abs((now_dt - center).total_seconds()) <= 300` enforces ±5min inclusive boundary. Uses now_cn() (UTC+8 enforced per project standard). Tests: test_none_window_lower_bound_inclusive (9:22:00 → send), test_none_window_upper_bound_inclusive (9:32:00 → send), test_none_just_outside_lower (9:21:59 → skip), test_none_just_outside_upper (9:32:01 → skip) — all PASS."
      status: VERIFIED
    - ac_id: AC5
      verification: "src/api/app.py:380 `result = run_screener_update(skip_email=True)` + docstring at line 376 references story 2.5. Manual /api/refresh-screener calls always skip email regardless of time."
      status: VERIFIED
    - ac_id: AC6
      verification: "main.py:37-45 cron job registration unchanged (verified `git log --oneline -- main.py` does not include 2.5 commits). Zero-arg APScheduler invocation → skip_email=None → AC4 time-window logic → 9:27 falls in [9:22, 9:32] window → email sent. Behavior char-for-char identical."
      status: VERIFIED
    - ac_id: AC7
      verification: "tests/scheduler/test_run_screener_skip_email.py exists with 10 tests covering 4 AC-mandated branches: (a) test_skip_email_true_never_sends, (b) test_skip_email_false_always_sends, (c) test_skip_email_none_in_window_sends [09:27:30], (d) test_skip_email_none_outside_window_skips [11:35:00]. Plus 6 boundary tests via TestShouldSendEmailGuard. Mocks send_screener_report and now_cn — no real network/SMTP. Pattern matches tests/notify/test_decision_consistency.py reference."
      status: VERIFIED

